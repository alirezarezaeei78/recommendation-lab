name: Recommendation correctness and local workflow
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python diversity_cli.py --user-id D01 --lambda-value 0.5 --n 5 --output /tmp/diversity-demo
      - run: python batch_cli.py --batch-size 7 --n 5 --output /tmp/batch-demo
