   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a44" x="51.84" y="63.715781" transform="rotate(-0 51.84 63.715781)">One batch, traceable ranking evidence</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536479" x="51.84" y="101.463281" transform="rotate(-0 51.84 101.463281)">Implemented local CLI + loopback API  |  workflow schematic, not a timing trace</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f82" x="82.08" y="163.44" transform="rotate(-0 82.08 163.44)">1  Validate the complete query batch</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a44" x="82.08" y="195.12" transform="rotate(-0 82.08 195.12)">Unique query IDs, known exclusions, bounded batch size</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f82" x="82.08" y="278.64" transform="rotate(-0 82.08 278.64)">2  Load the fixed scoring snapshot</text>
   </g>
   <g id="text_6">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a44" x="82.08" y="310.32" transform="rotate(-0 82.08 310.32)">Known fitted user: BPR factors  |  cold user: popularity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f82" x="82.08" y="393.84" transform="rotate(-0 82.08 393.84)">3  Score, filter, then rank</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a44" x="82.08" y="425.52" transform="rotate(-0 82.08 425.52)">Fixed factor order; remove all seen items; deterministic ties</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f82" x="82.08" y="509.04" transform="rotate(-0 82.08 509.04)">4  Export the same result object</text>
   </g>
   <g id="text_10">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a44" x="82.08" y="540.72" transform="rotate(-0 82.08 540.72)">Full-precision JSON + CSV, fallback reason + candidate hash</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ac670a" x="64.8" y="633.6" transform="rotate(-0 64.8 633.6)">Empty candidates remain visible as a query-status record.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536479" x="64.8" y="667.44" transform="rotate(-0 64.8 667.44)">Default demo: authored synthetic data. Research records and factors stay private.</text>
   </g>
  </g>
