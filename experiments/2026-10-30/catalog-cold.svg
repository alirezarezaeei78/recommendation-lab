  <g id="text_41">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #456073" x="56.16" y="825.7536" transform="rotate(-0 56.16 825.7536)">Exploratory reuse of the known MovieLens 100K time split; not independent validation.</text>
  </g>
  <g id="text_42">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #456073" x="56.16" y="847.872" transform="rotate(-0 56.16 847.872)">Cold start is simulated. Full past seen-item exclusion is oracle side information.</text>
  </g>
  <g id="text_43">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #456073" x="56.16" y="869.9904" transform="rotate(-0 56.16 869.9904)">Fixed genre snapshot assumed available at cutoff; historical availability unverified.</text>
  </g>
  <g id="text_44">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #456073" x="56.16" y="896.7168" transform="rotate(-0 56.16 896.7168)">Data: GroupLens Research; Harper &amp; Konstan (2015), DOI 10.1145/2827872. Research terms.</text>
  </g>
